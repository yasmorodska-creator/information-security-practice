services:
  api:
    build: .
    container_name: dean_office_api
    ports:
      - "3010:3010"
    volumes:
      - .:/app_code # Hot-reload коду
      - db_data:/app_code/data # Персистентність БД
    environment:
      - PYTHONUNBUFFERED=1
      - JWT_SECRET_KEY=my-dev-secret-key-32-chars-long!!
      - ENCRYPTION_KEY=kKs8SbzBA16tNqmPK7MnpPXHo0rA9BnIQ1bcJpY8swk=   
    restart: unless-stopped

volumes:
  db_data: